<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Event — EvAtlas</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#020204">
  <!--
    Event details now live in ONE place: the cinematic panel on the homepage
    (js/event-detail.js). This page only keeps old links working:
      event.html?id=<id>            → index.html#event=<id>
      event.html?id=<id>#register   → index.html#event=<id>&register
  -->
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('id') || '';
      var ok = /^[a-z0-9-]+$/.test(id);
      var target = ok ? 'index.html#event=' + encodeURIComponent(id) + (location.hash === '#register' ? '&register' : '')
                      : 'index.html#upcoming';
      location.replace(target);
    })();
  </script>
  <style>
    html, body { margin: 0; min-height: 100%; background: #020204; color: #fff; font: 15px/1.6 Poppins, system-ui, sans-serif; }
    a { color: #8ef4ff; }
    p { margin: 40vh auto 0; text-align: center; }
  </style>
</head>
<body>
  <p>Opening the event… <a href="index.html#upcoming">Go to events</a></p>
</body>
</html>
