<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Event — EVENTORA</title>
  <meta name="description" content="Event details on EVENTORA.">
  <meta name="theme-color" content="#020204">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23020204'/%3E%3Cellipse cx='24' cy='24' rx='17' ry='8.5' fill='none' stroke='%2335d8ff' stroke-width='3' transform='rotate(-32 24 24)'/%3E%3Ccircle cx='24' cy='24' r='6.5' fill='%2335d8ff'/%3E%3Ccircle cx='24' cy='24' r='2.6' fill='%23fff'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/stage.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="stylesheet" href="css/events.css">
  <link rel="stylesheet" href="css/registration.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Shared page background: ONE fixed layer behind every section (base
       #020204, blue atmosphere, two-layer starfield). Content scrolls over it,
       so stars never restart, duplicate or jump between sections. -->
  <div class="site-bg" aria-hidden="true">
    <div class="bg"></div>
    <div class="stars" id="stA"></div>
    <div class="stars" id="stB"></div>
  </div>

  <header class="navlayer" id="navlayer">
    <nav class="nav" id="nav" aria-label="Primary">
      <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="sw" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#8ef4ff"/>
            <stop offset=".5" stop-color="#35d8ff"/>
            <stop offset="1" stop-color="#0a86d8"/>
          </linearGradient>
          <linearGradient id="sw2" x1="40" y1="10" x2="10" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#a6f7ff"/>
            <stop offset="1" stop-color="#0f9ae0" stop-opacity=".25"/>
          </linearGradient>
        </defs>
        <g transform="rotate(-32 24 24)">
          <ellipse cx="24" cy="24" rx="18.5" ry="9.6" stroke="url(#sw2)" stroke-width="3.1"
                   stroke-linecap="round" stroke-dasharray="58 30" stroke-dashoffset="14"/>
          <circle cx="41.4" cy="20.6" r="3.1" fill="#bff6ff"/>
        </g>
        <circle cx="24" cy="24" r="6.6" fill="url(#sw)"/>
        <circle cx="24" cy="24" r="2.6" fill="#fff"/>
      </svg>

      <a class="wm" href="index.html" aria-label="Eventora home">
        <span class="kick" aria-hidden="true">EVENTS</span>
        <span class="name" id="wmName" aria-hidden="true">EVENTORA</span>
      </a>

      <button class="burger" id="burger" type="button" aria-label="Opens menu"
              aria-expanded="false" aria-controls="navmenu">
        <span></span><span></span><span></span>
      </button>

      <div class="navmenu" id="navmenu">
        <div class="links" id="links">
          <a href="index.html" data-nav="home">Home</a>
          <a href="index.html#featured" data-nav="explore">Explore Events</a>
          <a href="index.html#categories" data-nav="categories">Categories</a>
          <a href="index.html#about" data-nav="about">About</a>
          <a href="index.html#contact" data-nav="contact">Contact</a>
        </div>
        <a class="btn" href="host.html"><span id="ctaLabel">Host an Event</span></a>
      </div>
    </nav>
  </header>

  <div class="page-shell">
  <main id="main" tabindex="-1" class="event-detail-wrap">
    <div class="container">
      <a class="back-link" href="index.html#featured">
        <span aria-hidden="true">←</span> All events
      </a>
      <!-- Rendered by js/event-page.js from the catalogue (event.html?id=…) -->
      <article class="event-detail" id="eventDetail" aria-busy="true">
        <noscript><p class="lead">Turn on JavaScript to see this event.</p></noscript>
      </article>
    </div>
  </main>

  <!-- Registration form + confirmation. Cloned by js/registration-form.js
       below the event details when the event takes registrations. -->
  <template id="registerTemplate">
    <section class="register" id="register" aria-labelledby="registerTitle" hidden>
      <div class="container">
        <div class="register__card">
          <div class="register__view register__view--form" data-view="form">
            <header class="register__head">
              <p class="eyebrow" data-r="kicker">Registration</p>
              <h2 class="heading-2" id="registerTitle" data-r="title">Register for this event</h2>
              <p class="register__intro">All fields are required.</p>
            </header>

            <form class="register__form" id="registerForm" novalidate>
              <div class="field field--event">
                <label class="field__label" for="regEvent">Selected event</label>
                <input class="field__input" id="regEvent" name="event" type="text" readonly aria-readonly="true" aria-describedby="regEventHint">
                <p class="field__hint" id="regEventHint" data-r="when"></p>
              </div>

              <div class="field field--wide">
                <label class="field__label" for="regName">Full name</label>
                <input class="field__input" id="regName" name="name" type="text" autocomplete="name"
                       autocapitalize="words" spellcheck="false" maxlength="80" required aria-describedby="regNameError">
                <p class="field__error" id="regNameError" hidden></p>
              </div>

              <div class="field">
                <label class="field__label" for="regEmail">Email address</label>
                <input class="field__input" id="regEmail" name="email" type="email" autocomplete="email"
                       inputmode="email" spellcheck="false" maxlength="254" required aria-describedby="regEmailError">
                <p class="field__error" id="regEmailError" hidden></p>
              </div>

              <div class="field">
                <label class="field__label" for="regPhone">Phone number</label>
                <input class="field__input" id="regPhone" name="phone" type="tel" autocomplete="tel"
                       inputmode="tel" maxlength="24" required aria-describedby="regPhoneHint regPhoneError">
                <p class="field__hint" id="regPhoneHint">Include your country code, e.g. +44 20 7946 0958.</p>
                <p class="field__error" id="regPhoneError" hidden></p>
              </div>

              <div class="register__actions">
                <button class="btn btn--lg register__submit" type="submit"><span data-r="submit">Complete registration</span></button>
                <p class="register__privacy">Saved on this device only (demo). We keep just your name, email and phone for this booking.</p>
              </div>
              <p class="visually-hidden" id="regStatus" role="status"></p>
            </form>
          </div>

          <div class="register__view register__done" data-view="done" tabindex="-1" aria-labelledby="doneTitle" hidden>
            <span class="register__check" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </span>
            <p class="eyebrow" data-d="kicker">Confirmed</p>
            <h2 class="heading-2" id="doneTitle" data-d="title">You’re registered</h2>
            <p class="lead register__done-msg" data-d="msg"></p>

            <div class="register__ticket">
              <div class="register__id">
                <div class="register__id-text">
                  <span class="register__id-label">Registration ID</span>
                  <code class="register__id-code" data-d="id"></code>
                  <span class="register__id-hint">Show this QR code at check-in.</span>
                </div>
                <figure class="register__qr" data-d="qr"></figure>
              </div>
              <dl class="register__summary">
                <dt>Event</dt><dd data-d="event"></dd>
                <dt>When</dt><dd data-d="when"></dd>
                <dt>Venue</dt><dd data-d="venue"></dd>
                <dt>Name</dt><dd data-d="name"></dd>
                <dt>Email</dt><dd data-d="email"></dd>
              </dl>
            </div>

            <p class="register__note" data-d="note"></p>
            <div class="cluster register__done-actions">
              <a class="btn btn--md" data-d="mine" href="my-registrations.html"><span>View my registrations</span></a>
              <button class="btn-ghost" type="button" data-d="again">Register someone else</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </template>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p class="site-footer__brand">EVENTORA</p>
        <p class="placeholder-note">Footer placeholder — built in a later phase.</p>
        <p class="site-footer__legal">&copy; 2026 EVENTORA</p>
      </div>
    </footer>
  </div>

  <script src="js/core.js"></script>
  <script src="js/events.js"></script>
  <script src="js/starfield.js"></script>
  <script src="js/fitter.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/event-page.js"></script>
  <script src="js/registrations.js"></script>
  <script src="js/identity.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/registration-form.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
